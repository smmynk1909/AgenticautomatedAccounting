[alembic]
# `%(here)s` = this ini file's own directory (db/) — resolves correctly
# regardless of the caller's cwd. A bare `migrations` relative path only
# worked when alembic was invoked with cwd=db/; `make migrate` /
# `scripts/dev_bootstrap.sh` invoke it from the repo root
# (`uv run alembic -c db/alembic.ini ...`), where that resolved to a
# nonexistent `<repo-root>/migrations` and failed with "Path doesn't exist:
# migrations." (only ever a latent bug — Sprint 1/2 relied on sqlite unit
# tests + testcontainers-postgres tests that build their own in-process
# `Config` instead of the CLI entrypoint, and this box didn't have Docker
# until now to actually run `make migrate` for real).
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is set at runtime by migrations/env.py from $DATABASE_URL —
# never hardcode credentials here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
