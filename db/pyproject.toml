[project]
name = "awp-db"
version = "0.1.0"
description = "Alembic migrations, reference DDL, and synthetic seed data generator (doc 09 §1-2, §6)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.14",
  "pyyaml>=6.0",
  "faker>=33.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "psycopg2-binary>=2.9",
  "testcontainers[postgres]>=4.9",
]

[tool.uv]
# Script/config bundle (alembic migrations + seed scripts run by file path,
# not imported), not a wheel — skips hatchling package-layout requirements.
package = false
