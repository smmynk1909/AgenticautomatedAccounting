[project]
name = "awp-shared"
version = "0.1.0"
description = "Shared contracts for the Agentic Workforce Platform: schemas, auth, task bus, LLM/MCP clients, audit middleware."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "redis>=5.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_shared"]
