[project]
name = "awp-fincore"
version = "0.1.0"
description = "FinCore: deterministic, LLM-free finance engine (doc 06, doc 11 §4) — payroll, tax, ledger, invoicing, depreciation, cashflow."
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fincore"]
