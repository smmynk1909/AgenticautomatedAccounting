[project]
name = "awp-mcp-finance"
version = "0.1.0"
description = "mcp-finance: FinCore wrapper — ledger, payroll, invoicing, tax, depreciation, reconciliation, cashflow (doc 08 §2)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-fincore",
  "awp-shared",
  "awp-mcp-base",
  "redis>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21", "aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_mcp_finance"]
