[project]
name = "awp-mcp-base"
version = "0.1.0"
description = "Shared MCP server scaffolding: tool pipeline (auth/scope/idempotency/audit), unit-of-work, repo base."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-shared",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "structlog>=24.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_mcp_base"]
