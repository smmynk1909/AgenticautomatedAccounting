[project]
name = "awp-mcp-projects"
version = "0.1.0"
description = "mcp-projects: delivery issue tracking (Sprint 9) + repo read/index/secrets-scan/patch-artifacts for OPS-1 CodeAssist (Sprint 10) — doc 08 §8."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-shared",
  "awp-mcp-base",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_mcp_projects"]
