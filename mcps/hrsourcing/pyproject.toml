[project]
name = "awp-mcp-hrsourcing"
version = "0.1.0"
description = "mcp-hrsourcing: resume extraction, profile normalization, external sourcing connectors (doc 08 §7)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-shared",
  "awp-mcp-base",
  "redis>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pdfplumber>=0.11",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21", "xhtml2pdf>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_mcp_hrsourcing"]
