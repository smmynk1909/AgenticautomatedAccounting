[project]
name = "awp-mcp-docs"
version = "0.1.0"
description = "mcp-docs: document extraction/rendering/storage (doc 08 §3). See DEVIATIONS.md #13 for the WeasyPrint -> xhtml2pdf swap."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-shared",
  "awp-mcp-base",
  "redis>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "xhtml2pdf>=0.2.16",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "minio>=7.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = ["awp_mcp_docs"]` already picks up templates/ (it's a
# subdirectory of the package) — a `force-include` entry for the same path
# double-adds it to the wheel archive. Harmless with `uv sync`'s local build
# (apparently absorbed silently on Windows), but a fresh `pip install` in
# the Linux container image hard-fails with "A second file is being added
# to the wheel archive at the same path" (hatchling). Found via `docker
# compose build`, not a unit test — see DEVIATIONS.md.
packages = ["awp_mcp_docs"]
