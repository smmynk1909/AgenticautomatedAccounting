[project]
name = "awp-mcp-approvals"
version = "0.1.0"
description = "mcp-approvals: HITL gates and cryptographic approval-token minting (doc 08 §5)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-shared",
  "awp-mcp-base",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_mcp_approvals"]
