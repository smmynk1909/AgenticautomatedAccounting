# HITL Approval Gate Registry — doc 09 §5 (+ doc 03/04/05/06/07 tool sections).
# Changing this file is itself gated behind an admin-approved PR (doc 08 §5).
# `payload_model` = the Pydantic model the gate's approval-card payload must
# validate against (rendered read-only to approvers); null = generic dict
# payload until that flow is implemented (tracked per-sprint in the docs).

payroll_run:
  approver_roles: [finance_head, director]
  n_required: 2
  ttl_h: 24
  payload_model: PayrollRunApprovalPayload
  notes: "maker-checker; doc 06 §2.1"

