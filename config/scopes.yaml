# Tool → required-scope map (doc 08 §0, §10). Enforced by mcps/_base scope_mw:
# a caller's JWT `scopes[]` (agent service-account or human session) must be a
# superset of the tool's list, else PERMISSION_DENIED + audit event.
#
# Sprint 1 implements only the `audit.*` and `approvals.*` groups (mcp-audit,
# mcp-approvals exist today). The rest mirror doc 08 §10's matrix so agent
# `config.yaml` scope grants (written per-agent as each agent lands) have a
# fixed target to point at — the tools themselves 404 until their MCP server
# is implemented in a later sprint.

# --- mcp-audit (Sprint 1) ---
audit.log_event: [audit.write]
audit.query_events: [audit.read]
audit.export_audit: [audit.admin]
audit.compute_day_root: [audit.admin]

# --- mcp-approvals (Sprint 1) ---
approvals.request_approval: [approvals.request]
approvals.get_approval_status: [approvals.read]
# approve/reject are human-only UI endpoints, not MCP tools — no agent scope
# can ever satisfy them (doc 08 §5, structurally enforced, not a scope check).

