# Intent Registry — doc 02 §5 / doc 11 §8.
# `gate: null` = never approval-gated. `conditional: true` on a gate means the
# gate only fires when the *agent's own policy check* (not the LLM) decides
# the payload crosses a threshold (see the referenced doc section) — ORCH-0's
# code-side validation still treats `gate` as authoritative for whether the
# task *can ever* require approval, but the per-instance decision is made by
# the owning agent's deterministic policy node, not by the LLM plan.
# `payload_model` names resolve to classes in shared/awp_shared/intent_models.py.

- intent: issue_device
  agent: ADM-1
  payload_model: IssueDeviceIn
  gate: asset_high_value
  conditional: true          # doc 03 §2.1: only if asset value > entitlements.yaml threshold
  sla_hours: 24

- intent: return_device
  agent: ADM-1
  payload_model: ReturnDeviceIn
  gate: null
  sla_hours: 48

- intent: device_repair
