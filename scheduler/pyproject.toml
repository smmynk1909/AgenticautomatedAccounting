[project]
name = "awp-scheduler"
version = "0.1.0"
description = "Cron -> TaskEnvelope dispatch sidecar + ORCH-0 DAG reconcile sweep (doc 02 §7)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-shared",
  "awp-agent-base",
  "awp-agent-orch0",
  "redis>=5.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_scheduler"]
