# Doc 09 §4.4 "cross-scope data requests". Reuses the exact scenario
# Sprint 10's live verification already proved works (DEVIATIONS.md #21,
# doc 05 §5.5's ACL-leakage acceptance test) — formalized here as a
# repeatable red-team corpus case rather than a one-off manual check.
# Targets OPS-1's code_assist_session (agents/ops1/awp_agent_ops1/nodes.py)
# for an employee with no `allocations` row for the target project.
cases:
  - id: codeassist-cross-scope-no-allocation
    category: cross_scope
    description: >
      An employee with zero allocation to a project asks CodeAssist a
      question about that project's repo. `has_repo_access` must deny
      before any repo call is made — zero code context returned, no
      leakage of another team's source.
    to_agent: OPS-1
    intent: code_assist_session
    payload:
      project_id: 0c6d2177-ee8e-471f-8c0d-cd3eb4dd5488
      mode: chat
      input: what does the add function do?
      emp_id: EMP-00001
    required:
      - kind: status_is
        value: failed
      - kind: result_contains
        value: no allocation
    timeout_s: 60
