name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dev-mode secrets for the test run only — never real credentials.
      AWP_DEV_JWT_SECRET: ci-test-service-secret-32-bytes-minimum
      AWP_APPROVAL_JWT_SECRET: ci-test-approval-secret-32-bytes-minimum
      AWP_JWT_ISSUER: awp-ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: uv sync (workspace)
        run: uv sync --all-packages

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format check)
        run: uv run ruff format --check .

      - name: mypy — shared, mcps/_base, mcp-audit, mcp-approvals, mcp-erp
        run: uv run mypy -p awp_shared -p awp_mcp_base -p awp_mcp_audit -p awp_mcp_approvals -p awp_mcp_erp

      # Unit: schemas/auth/bus/llm/mcpc/trust/config/audit_mw/intent_models
      # (doc 12 §4 "unit (shared,fincore)" — fincore lands Sprint 5).
      # Contract: mcps/_base + mcp-audit + mcp-approvals business logic
      # (sqlite-backed, fast) + db/tests/test_migrations.py (testcontainers-
      # postgres, doc 12 §4's actual "contract ... testcontainers-postgres"
      # step, since GH-hosted runners ship Docker).
      - name: pytest (unit + contract)
        run: uv run pytest -q --cov=shared/awp_shared --cov=mcps --cov-report=term-missing

      # Graph tests (agents/, mocked LLM+MCP fixtures) and coverage gates
      # (fincore 95% / mcps 85% / agent graph-paths 100%, doc 12 §4) land as
      # those components do (Sprint 3+) — nothing to run yet.
