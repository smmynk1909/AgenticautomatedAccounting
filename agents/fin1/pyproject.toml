[project]
name = "awp-agent-fin1"
version = "0.1.0"
description = "FIN-1: finance agent — payroll, bookkeeping, billing, tax, financial-requirement analysis (doc 06)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "awp-shared",
  "awp-agent-base",
  "langgraph>=0.2,<0.3",
  "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp_agent_fin1"]
