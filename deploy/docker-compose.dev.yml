      redis:
        condition: service_healthy
      mcp-erp:
        condition: service_started
      mcp-finance:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_ERP_URL: http://mcp-erp:8000
      MCP_FINANCE_URL: http://mcp-finance:8000
      AWP_ENV: ${AWP_ENV}
      # KEYCLOAK_URL is deliberately NOT the plain `http://keycloak:8080`
      # every other container-to-container URL in this file uses — the
      # gateway's own outbound calls (JWKS fetch, token exchange) and every
      # *verification* of a token's `iss` claim must resolve the exact same
      # way, or Keycloak's request-derived issuer won't match what
      # `keycloak_issuer()` expects (see DEVIATIONS.md #22 for the full
      # reasoning — live-verified, not guessed). `host.docker.internal`
      # (Docker Desktop's host-loopback DNS entry, Windows/Mac only) reaches
      # the *same* published Keycloak port a host-side browser/curl call
      # does via `localhost:8080`, keeping both paths issuer-consistent.
      KEYCLOAK_URL: http://host.docker.internal:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-awp}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-awp-gateway}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
    ports:
      - "8000:8000"

