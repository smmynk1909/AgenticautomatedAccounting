# Sprint 1-10 stack — DEVIATIONS.md #3: trimmed to what's landed so far
# (Postgres, Redis, MinIO, Ollama, Qdrant, Gitea, mcp-audit, mcp-approvals,
# mcp-erp, mcp-comms, mcp-docs, mcp-finance, mcp-search, mcp-hrsourcing,
# mcp-projects, gateway, orch0, sup1, adm1, fin1, hr1, ops1, scheduler).
# Keycloak/observability are added to this same file as their owning
# sprints land.
#
# Usage: `make up` (== `docker compose -f deploy/docker-compose.dev.yml
# --env-file .env up -d`). Build contexts are the repo root so each service's
# Dockerfile can COPY shared/ and mcps/_base/ alongside its own package.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # See .env.example's Postgres comment: defaults to a non-standard host
      # port because some dev boxes already have a native postgres on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      # Default 5m keep-alive is shorter than a cold model load on this
      # host's CPU-only inference (live-verified, Sprint 10 DEVIATIONS.md) —
      # a model can get evicted before it ever finishes loading from disk,
      # forcing every subsequent call to restart the load from scratch.
      - OLLAMA_KEEP_ALIVE=1h
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # GPU passthrough is optional — CPU inference works, just slower
    # (doc 09 §3 "CPU-only fallback"). Uncomment if an NVIDIA GPU + the
    # NVIDIA Container Toolkit are available on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    # No healthcheck: the official image ships no curl/wget/nc for a CMD
    # probe. Dependents use `condition: service_started` (same pattern as
    # `ollama` above) and mcp-search retries collection creation on boot.

  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - giteadata:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # Sprint 11 — DEVIATIONS.md #22: real OIDC for human sessions, replacing
    # dev-JWT (DEVIATIONS.md #2). `start-dev` (not the doc's plain `start`)
    # is Keycloak's own local-dev mode — HTTP allowed, no reverse-proxy TLS
    # termination required — matching every other trimmed-for-local-dev
    # service in this compose file. `--import-realm` loads
    # `deploy/keycloak/realm-export.json` (the `awp` realm, its roles, dev
    # users, and the `awp-gateway` client) once at first boot only — it does
    # NOT re-sync the file into an already-created realm on restart; changes
    # to the file need a fresh `keycloakdata` volume to take effect again.
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-change-me}
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    # No CMD-SHELL healthcheck: the official image ships no curl/wget, and
    # `/dev/tcp` is a bash-ism this image's shell doesn't support (same
    # class of gap as `qdrant` above). Dependents use
    # `condition: service_started` and the gateway's own OIDC calls fail
    # loudly (UpstreamError) if Keycloak isn't actually ready yet.

  mcp-audit:
    build:
      context: ..
      dockerfile: mcps/audit/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Container-internal addresses (docker network service names), NOT the
      # host-facing $DATABASE_URL/$REDIS_URL in .env (those use `localhost`
      # for `make migrate`/`make seed`, which run on the host, not in Docker).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      # awp_shared.config.validate_all() validates every config/*.yaml at
      # boot, including models.yaml — whose `gateway_url` interpolates this
      # var — even for servers (like this one) that never call the LLM
      # themselves. Omitting it here crash-loops the container on start.
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      AWP_AUDIT_SPOOL_DIR: /app/.spool/audit
    volumes:
      - audit_spool:/app/.spool/audit
    ports:
      - "8001:8000"

  mcp-approvals:
    build:
      context: ..
      dockerfile: mcps/approvals/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-audit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_AUDIT_URL: http://mcp-audit:8000
    ports:
      - "8002:8000"

  mcp-erp:
