# Sprint 1-4 stack — DEVIATIONS.md #3: trimmed to what's landed so far
# (Postgres, Redis, MinIO, Ollama, mcp-audit, mcp-approvals, mcp-erp,
# mcp-comms, mcp-docs, gateway, orch0, sup1, adm1, scheduler). Qdrant/Gitea/
# Keycloak/observability/the remaining agent containers/web are added to
# this same file as their owning sprints land.
#
# Usage: `make up` (== `docker compose -f deploy/docker-compose.dev.yml
# --env-file .env up -d`). Build contexts are the repo root so each service's
# Dockerfile can COPY shared/ and mcps/_base/ alongside its own package.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # See .env.example's Postgres comment: defaults to a non-standard host
      # port because some dev boxes already have a native postgres on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # GPU passthrough is optional — CPU inference works, just slower
    # (doc 09 §3 "CPU-only fallback"). Uncomment if an NVIDIA GPU + the
    # NVIDIA Container Toolkit are available on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  mcp-audit:
    build:
      context: ..
      dockerfile: mcps/audit/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Container-internal addresses (docker network service names), NOT the
      # host-facing $DATABASE_URL/$REDIS_URL in .env (those use `localhost`
      # for `make migrate`/`make seed`, which run on the host, not in Docker).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      # awp_shared.config.validate_all() validates every config/*.yaml at
      # boot, including models.yaml — whose `gateway_url` interpolates this
      # var — even for servers (like this one) that never call the LLM
      # themselves. Omitting it here crash-loops the container on start.
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      AWP_AUDIT_SPOOL_DIR: /app/.spool/audit
    volumes:
      - audit_spool:/app/.spool/audit
    ports:
      - "8001:8000"

  mcp-approvals:
    build:
      context: ..
      dockerfile: mcps/approvals/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-audit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_AUDIT_URL: http://mcp-audit:8000
    ports:
      - "8002:8000"

  mcp-erp:
    build:
      context: ..
      dockerfile: mcps/erp/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-audit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_AUDIT_URL: http://mcp-audit:8000
    ports:
      - "8003:8000"

  mcp-comms:
    build:
      context: ..
      dockerfile: mcps/comms/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-audit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_AUDIT_URL: http://mcp-audit:8000
    ports:
      - "8004:8000"

  mcp-docs:
    build:
      context: ..
      dockerfile: mcps/docs/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mcp-audit:
        condition: service_started
    environment:
      # No Postgres table for mcp-docs (doc 12 §2's tree lists none) — scope
      # is stored as MinIO object metadata instead (storage.py).
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_AUDIT_URL: http://mcp-audit:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
    ports:
      - "8005:8000"

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-erp:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_ERP_URL: http://mcp-erp:8000
      AWP_ENV: ${AWP_ENV}
    ports:
      - "8000:8000"

  orch0:
    build:
      context: ..
      dockerfile: agents/orch0/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-erp:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MODEL_GEN: ${MODEL_GEN}
      MCP_ERP_URL: http://mcp-erp:8000
      MCP_APPROVALS_URL: http://mcp-approvals:8000
      MCP_AUDIT_URL: http://mcp-audit:8000

  adm1:
    build:
      context: ..
      dockerfile: agents/adm1/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-erp:
        condition: service_started
      mcp-docs:
        condition: service_started
      mcp-approvals:
        condition: service_started
      mcp-comms:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MODEL_SMALL: ${MODEL_SMALL}
      MCP_ERP_URL: http://mcp-erp:8000
      MCP_DOCS_URL: http://mcp-docs:8000
      MCP_APPROVALS_URL: http://mcp-approvals:8000
      MCP_COMMS_URL: http://mcp-comms:8000

  sup1:
    build:
      context: ..
      dockerfile: agents/sup1/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-erp:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MODEL_SMALL: ${MODEL_SMALL}
      MCP_ERP_URL: http://mcp-erp:8000

  scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-erp:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MODEL_GATEWAY_URL: http://ollama:11434/v1
      MCP_ERP_URL: http://mcp-erp:8000

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
  audit_spool:
