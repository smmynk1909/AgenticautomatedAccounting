# Sprint 1 stack — DEVIATIONS.md #3: trimmed to what Sprint 1 needs (Postgres,
# Redis, MinIO, Ollama, mcp-audit, mcp-approvals). Qdrant/Gitea/Keycloak/
# observability are added to this same file as their owning sprints land.
#
# Usage: `make up` (== `docker compose -f deploy/docker-compose.dev.yml
# --env-file .env up -d`). Build contexts are the repo root so each service's
# Dockerfile can COPY shared/ and mcps/_base/ alongside its own package.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # GPU passthrough is optional — CPU inference works, just slower
    # (doc 09 §3 "CPU-only fallback"). Uncomment if an NVIDIA GPU + the
    # NVIDIA Container Toolkit are available on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  mcp-audit:
    build:
      context: ..
      dockerfile: mcps/audit/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Container-internal addresses (docker network service names), NOT the
      # host-facing $DATABASE_URL/$REDIS_URL in .env (those use `localhost`
      # for `make migrate`/`make seed`, which run on the host, not in Docker).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      AWP_AUDIT_SPOOL_DIR: /app/.spool/audit
    volumes:
      - audit_spool:/app/.spool/audit
    ports:
      - "8001:8000"

  mcp-approvals:
    build:
      context: ..
      dockerfile: mcps/approvals/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-audit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AWP_DEV_JWT_SECRET: ${AWP_DEV_JWT_SECRET}
      AWP_APPROVAL_JWT_SECRET: ${AWP_APPROVAL_JWT_SECRET}
      AWP_JWT_ISSUER: ${AWP_JWT_ISSUER}
      MCP_AUDIT_URL: http://mcp-audit:8000
    ports:
      - "8002:8000"

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
  audit_spool:
