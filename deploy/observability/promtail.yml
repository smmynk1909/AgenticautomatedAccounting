# Promtail config — ships every container's stdout/stderr to Loki. Docker
# service discovery (not a static per-container list) so new containers
# are picked up automatically; every agent already logs structured JSON
# via `structlog` (doc 00 §7), so Loki gets the same structured lines
# `docker compose logs` shows, just centrally queryable in Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
