# Prometheus scrape config — doc 10 HLD C19. Every AWP process either runs
# a real `/metrics` endpoint (gateway, the 9 mcp-* servers — all FastAPI,
# via `mcps/_base/awp_mcp_base/asgi.py`) or, for the 6 bus-consumer agents
# plus the scheduler (no HTTP server otherwise), a minimal stdlib
# `/metrics` listener on :9100 (`agents/_base/awp_agent_base/metrics_server.py`).
# The otel-collector job scrapes the same metrics again via its own OTLP
# re-export (:8889) — redundant with the per-service exporters below for
# metrics *these processes* emit through `awp_shared.metrics`, but it's
# also the only path for anything pushed purely via OTel's metrics API
# rather than `prometheus_client` directly, so both are kept.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: mcp-servers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "mcp-audit:8000"
          - "mcp-approvals:8000"
          - "mcp-erp:8000"
          - "mcp-comms:8000"
          - "mcp-finance:8000"
          - "mcp-docs:8000"
          - "mcp-search:8000"
          - "mcp-hrsourcing:8000"
          - "mcp-projects:8000"

  - job_name: agents
    metrics_path: /metrics
    static_configs:
      - targets:
          - "orch0:9100"
          - "adm1:9100"
          - "fin1:9100"
          - "hr1:9100"
          - "ops1:9100"
          - "sup1:9100"
          - "scheduler:9100"
